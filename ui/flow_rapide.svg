<svg class="flow" viewBox="0 0 760 698" role="img" aria-label="Parcours du mode Rapide : langue, traduction si besoin, recherche par le sens, par mots-clés et par numéro, fusion, reranking, une réponse" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="m" d="M0 0 L8 4 L0 8 z"/></marker></defs>
